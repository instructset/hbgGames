<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Games</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #0f1115;
    --card: #1a1d24;
    --text: #f0f0f0;
    --muted: #9aa0aa;
    --accent: #ffd23f;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    min-height: 100vh;
    padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  header { max-width: 640px; text-align: center; margin-bottom: 32px; }
  h1 { font-size: 2rem; margin-bottom: 8px; }
  p.tagline { color: var(--muted); font-size: 1rem; line-height: 1.5; }
  .grid {
    display: grid;
    gap: 16px;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    width: 100%;
    max-width: 640px;
  }
  a.game {
    display: block;
    background: var(--card);
    border: 1px solid #2a2e37;
    border-radius: 14px;
    padding: 20px;
    text-decoration: none;
    color: var(--text);
    transition: border-color 0.15s ease;
  }
  a.game:hover, a.game:focus-visible {
    border-color: var(--accent);
    outline: none;
  }
  a.game:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .game h2 { font-size: 1.15rem; margin-bottom: 4px; }
  .game p { color: var(--muted); font-size: 0.9rem; }
  .empty { color: var(--muted); text-align: center; padding: 40px 20px; max-width: 480px; }
  footer { margin-top: 48px; color: var(--muted); font-size: 0.85rem; text-align: center; }
</style>
</head>
<body>
<header>
  <h1>Games</h1>
  <p class="tagline">Free browser games — memory, focus and fun. No install, no account, just tap and play.</p>
</header>

<!-- GAMES-LIST-START -->
<div class="grid">
<a class="game" href="memory-match/"><h2>Memory Match</h2><p>Flip cards, find the pairs. Three difficulty levels.</p></a>
</div>
<!-- GAMES-LIST-END -->

<footer>&copy; 2026 Pav Batra. All rights reserved.</footer>
</body>
</html>
